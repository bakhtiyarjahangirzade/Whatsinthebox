name: Windows lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build application and integration tests
        shell: pwsh
        run: |
          ./scripts/build.ps1
          dotnet publish tests/Tests.csproj -c Release --self-contained false -o artifacts/windows-tests -m:1
          if ($LASTEXITCODE -ne 0) { throw 'Integration test build failed' }
      - name: Prepare isolated installer environment
        shell: pwsh
        run: ./scripts/prepare-windows.ps1
      - name: Compile installer
        shell: pwsh
        run: |
          ISCC installer/Setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Isolated Windows lifecycle and shell checks
        shell: pwsh
        run: ./scripts/run-isolated.ps1 -Script check-windows.ps1
      - name: Installer user journeys
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/run-isolated.ps1 -Script check-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-lifecycle-evidence
          path: artifacts/windows-checks
